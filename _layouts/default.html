<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://unpkg.com; img-src 'self' data:; font-src 'self' https://unpkg.com; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <title>{{ site.title | default: "Hacking For Ramen blog" }}</title>
  <link rel="stylesheet" href="https://unpkg.com/98.css@0.1.21/dist/98.css" integrity="sha384-15ft94Qa+wtquckGuqoUZVwmRnPrMFakV20jxURH5clORpGUeXAbhNK5x6aVebrD" crossorigin="anonymous" />
  <link rel="stylesheet" href="{{ '/assets/css/desktop.css' | relative_url }}" />
</head>
<body>
  <div class="desktop" id="desktop">
    <div class="desktop-icon" id="icon-posts">
      <div class="desktop-icon-glyph">&#128193;</div>
      <div class="desktop-icon-label">My Posts</div>
    </div>

    <div id="windows-layer"></div>

    <div class="taskbar">
      <button class="taskbar-start" id="start-button">&#8862; Start</button>
      <div class="taskbar-items" id="taskbar-items"></div>
      <div class="taskbar-clock" id="taskbar-clock"></div>
    </div>

    <div class="start-menu" id="start-menu" hidden>
      <ul>
        <li id="start-menu-posts">&#128193; My Posts</li>
        <li><a href="https://github.com/z3v5/z3v5.github.io" target="_blank" rel="noopener">&#128187; View source on GitHub</a></li>
      </ul>
    </div>
  </div>

  <script type="application/json" id="posts-data">
    [
      {% for post in site.posts %}
      {
        "id": {{ forloop.index | jsonify }},
        "title": {{ post.title | jsonify }},
        "date": {{ post.date | date: "%B %-d, %Y" | jsonify }},
        "url": {{ post.url | relative_url | jsonify }},
        "content": {{ post.content | jsonify }}
      }{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ]
  </script>
  <script src="{{ '/assets/js/desktop.js' | relative_url }}"></script>
</body>
</html>
